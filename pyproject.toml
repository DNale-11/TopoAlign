[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "TopoAlign"
version = "0.1.0"
description = "Topology-guided cellular image registration CLI"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.22,<2.0",
  "pandas>=1.5,<2.1",
  "scikit-image>=0.20,<0.23",
  "scikit-learn>=1.2,<1.5",
  "scipy>=1.9,<1.13",
  "imageio>=2.31,<3.0",
  "tifffile>=2023.7,<2025.0",
  "rich>=13,<15",
]

[project.optional-dependencies]
agent = ["openai>=1,<3"]

[project.scripts]
topoalign = "cell_registration.cli:main"

[tool.setuptools]
packages = ["cell_registration"]
